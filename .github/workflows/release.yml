name: Release

# Push a tag like v1.0.0 to build packages for every platform and attach them to a GitHub release.
# Run it by hand (Actions > Release > Run workflow) to just build the packages as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rids: win-x64 win-arm64
          - os: ubuntu-latest
            rids: linux-x64 linux-arm64
          - os: macos-latest
            rids: osx-arm64 osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test
        run: dotnet test tests/Kimulator.Tests -c Release

      - name: Package
        shell: bash
        run: ./scripts/package.sh ${{ matrix.rids }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
